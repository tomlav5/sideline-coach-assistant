<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline'; object-src 'none';" />

    <title>Sideline Assist</title>
    <meta name="description" content="Track match stats from the touchline — goals, substitutions and playing time for grassroots football." />
    <meta name="author" content="Sideline Assist" />

    <!-- Installable web app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#101724" />

    <!-- iOS home screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Sideline" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />

    <!-- Favicons. A simplified mark — the full lockup is illegible below ~48px. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96" />

    <!-- Link previews (WhatsApp, iMessage, Slack, X) -->
    <meta property="og:site_name" content="Sideline Assist" />
    <meta property="og:title" content="Sideline Assist" />
    <meta property="og:description" content="Track match stats from the touchline — goals, substitutions and playing time for grassroots football." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sidelineassist.club/" />
    <meta property="og:image" content="https://sidelineassist.club/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sideline Assist — match tracking for grassroots football" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sideline Assist" />
    <meta name="twitter:description" content="Track match stats from the touchline — goals, substitutions and playing time for grassroots football." />
    <meta name="twitter:image" content="https://sidelineassist.club/og-image.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
